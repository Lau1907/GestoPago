name: mobile_app
description: "Aplicación móvil bancaria Flutter para pagos de servicios con GestoPago y control de sesión única."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Manejo de estado
  provider: ^6.1.2

  # Red y HTTP
  http: ^1.2.2

  # Almacenamiento seguro de tokens y credenciales
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Utilidades y UUID para Idempotency Keys
  uuid: ^4.5.1
  intl: 0.20.3

  # Animaciones e iconos modernos
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
