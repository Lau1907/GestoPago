# Configuración de pruebas de integración con H2 en memoria aislada
spring.application.name=proyecto-servicio-empresa

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false
spring.jpa.properties.hibernate.default_schema=public

# Configuración del servicio externo GestoPago / PuntoRed
gestopago.service.url=https://gestopago.portalventas.net
gestopago.auth.url=https://gestopago.portalventas.net
gestopago.auth.id-distribuidor=83
gestopago.auth.codigo-dispositivo=GPS83-TPV-17
gestopago.auth.password=${GESTOPAGO_PASSWORD:}
gestopago.auth.bearer-token=
gestopago.auth.refresh-rate-ms=82800000

gestopago.service.connect-timeout-ms=5000
gestopago.service.read-timeout-ms=10000
spring.cloud.config.enabled=false

# Configuración JWT y Onboarding
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=3600000
onboarding.cuenta.saldo-inicial=0.00
