# Configuración del servidor y aplicación
server.port=8080
spring.application.name=proyecto-servicio-empresa

# Configuración de base de datos H2 persistente en archivo local
spring.datasource.url=jdbc:h2:file:./data/gestopago_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
spring.jpa.properties.hibernate.default_schema=public

# Configuración del servicio externo GestoPago / PuntoRed
gestopago.service.url=https://gestopago.portalventas.net
gestopago.auth.url=https://gestopago.portalventas.net
gestopago.auth.id-distribuidor=83
gestopago.auth.codigo-dispositivo=GPS83-TPV-17
gestopago.auth.password=${GESTOPAGO_PASSWORD:}
gestopago.auth.bearer-token=
gestopago.auth.refresh-rate-ms=82800000

# Timeouts de integración (ms)
gestopago.service.connect-timeout-ms=5000
gestopago.service.read-timeout-ms=10000
spring.cloud.config.enabled=false

# Configuración JWT y Onboarding
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=3600000
onboarding.cuenta.saldo-inicial=0.00

# Configuración SMTP para envío de códigos 2FA
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

logging.level.org.springframework.security=DEBUG