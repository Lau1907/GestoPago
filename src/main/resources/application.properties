# Configuración del servidor y aplicación
server.port=8080
spring.application.name=proyecto-servicio-empresa

# Configuración de base de datos H2 / PostgreSQL (según perfil)
spring.datasource.url=jdbc:h2:mem:testdb;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.properties.hibernate.default_schema=public

# Configuración del servicio externo GestoPago / PuntoRed
gestopago.service.url=https://gestopago.portalventas.net
gestopago.auth.url=https://gestopago.portalventas.net
gestopago.auth.id-distribuidor=83
gestopago.auth.codigo-dispositivo=GPS83-TPV-17
gestopago.auth.password=12345678
gestopago.auth.bearer-token=
gestopago.auth.refresh-rate-ms=3600000

# Timeouts de integración (ms)
gestopago.service.connect-timeout-ms=5000
gestopago.service.read-timeout-ms=10000
spring.cloud.config.enabled=false